        <main class="flex gap-6 h-[85vh] pt-5 relative">
            <!-- Hero -->
            <section class="flex w-full h-full">
                <div class="flex flex-col gap-10 justify-center items-center w-[70vw] h-full">
                    <div class="w-2/3 flex flex-col gap-5 text-center">
                        <h1 class="text-5xl">Votre portefeuille boosté par la technologie</h1>
                        <p class="text-lg text-[#00153E]">Automatisez vos paiements, analysez vos dépenses et restez maître de votre budget.</p>
                    </div>
                    <button id="nouvelle" class="px-5 py-3 w-1/2 my-4 bg-[#f29a00] text-white text-xl rounded-xl">Nouvelle transaction</button>
                </div>
                <div class="px-5 grid grid-row-3 items-center w-[30vw]">
                    <div class="flex flex-col gap-4 px-5 pt-3 pb-4 rounded-xl bg-[#34D171] text-white">
                        <h2 class="text-2xl font-semibold">Total des revenus</h2>
                        <div>
                            <data id="revenus">0</data> DH
                        </div>
                    </div>
                    <div class="flex flex-col gap-4 px-5 pt-3 pb-4 rounded-xl text-white bg-red-400">
                        <h2 class="text-2xl font-semibold">Total des dépenses</h2>
                        <div>
                            <data id="depenses">0</data> DH
                        </div>
                        <!-- <button class="px-5 mb-4 bg-[#f29a00] text-white rounded-xl w-1/2">Plus de détails</button> -->
                    </div>
                    <div class="flex flex-col gap-4 px-5 pt-3 pb-4 rounded-xl text-white bg-[#012962]">
                        <h2 class="text-2xl font-semibold">Solde net</h2>
                        <div>
                            <data id="solde">0</data> DH
                        </div>
                    </div>
                </div>
            </section>
            <!-- Ajout nouvelle transaction -->
            <section id="dialog" class="hidden flex justify-center items-center fixed inset-0 bg-black/75">
                <form class="flex px-10 py-6 bg-white rounded-2xl">
                    <fieldset class="grid grid-col-6 gap-4">
                        <legend class="col-span-6 mb-4 font-semibold text-xl text-[#012962]">Nouvelle transaction</legend>
                        <label class="col-span-1 col-start-1 font-medium text-lg" for="montant">Montant:</label>
                        <input class="col-span-2 col-start-2 border-lime-300 border-b-2 outline-0 px-2" type="number" name="montant" id="montant" placeholder="Exemple: 532.99" required>
                        <label class="col-span-1 col-start-4 font-medium text-lg" for="type">Type:</label>
                        <select class="col-span-2 col-start-5 border-lime-300 border-b-2 outline-0 px-2" name="type" id="type">
                            <option value="revenu">Revenu</option>
                            <option value="depense">Dépense</option>
                        </select>
                        <label class="col-span-1 col-start-1 font-medium text-lg" for="date">Date:</label>
                        <input class="col-span-5 col-start-2 border-lime-300 border-b-2 outline-0 px-2" type="date" name="date" id="date" required>
                        <label class="col-span-6 font-medium text-lg" for="description">Description</label>
                        <textarea class="col-span-6 border-lime-300 border-2 outline-0 p-2 rounded-xl overflow-y-auto" name="description" id="description" placeholder="Ajouter plus d'information"></textarea>
                        <button id="ajouter" class="col-span-1 col-start-1 font-medium text-lg bg-[#f29a00] px-5 py-1 rounded-xl">Ajouter</button>
                        <button id="annuler" class="col-span-1 col-start-6 font-medium text-lg bg-[#f29a00] px-5 py-1 rounded-xl">Annuler</button>
                    </fieldset>
                </form>
            </section>
        </main>
        <script src="script.js"></script>
